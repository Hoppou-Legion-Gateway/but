name: Build and release

# Releases the version in pyproject.toml when it has no `v<version>` tag yet.
# Bump it manually, e.g. `uv version --bump minor`, and push to main.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the full history and existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check whether version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(uv version --short)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::$TAG is already released; bump the version in pyproject.toml to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: uv build

      - name: Generate release notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # Commits since the previous tag, rendered as $TAG using cliff.toml.
        run: uvx git-cliff@2.14.2 --unreleased --tag "$TAG" --output "$RUNNER_TEMP/notes.md"

      - name: Create tag & GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --notes-file "$RUNNER_TEMP/notes.md"
