name: Build and release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump commit, create the tag and release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get next version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch
          use_api: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Bump version in pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version --no-sync "$VERSION"

      - name: Build
        run: uv build

      - name: Commit and push version bump
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: release $VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag & GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.bump.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$SHA"
          --title "$VERSION"
          --generate-notes
